- postx:
    id: 221577240931090432
    account: BABYMETAL_JAPAN
    label: Shows in Osaka done
    published-date: 2012-07-07
    text: |-
      初の大阪公演終了DEATH！！観にきてくれた皆さんありがとうございました！！明日は名古屋行くぞーっ！！ #babymetal
    translation: |-
      The first Osaka show has ended DEATH!! Thank you very much to everyone who came to see us!! Tomorrow, let's head to Nagoya!! #babymetal
    image:
    - AxMzU6BCQAEnnq-
    part-of:
      tour: headbangpilgrimage

- postx:
    id: 221913230300286976
    account: BABYMETAL_JAPAN
    label: Thank you
    published-date: 2012-07-08
    text: |-
      BABYMETAL「ヘドバ行脚ー！！」無事終了しました！！大阪、名古屋の方、遠くから応援に来てくれた方、本当にありがとうございました！！今度はもっと沢山の場所に行って来れなかった方にも会うことが出来たら、いいね！ #babymetal
    translation: |-
      BABYMETAL "Hedoba Pilgrimage!!" has successfully concluded!! To everyone in Osaka and Nagoya, and those who came to support us from far away, thank you so very much!! Next time, if we could visit even more places and meet those who couldn't make it, wouldn't that be "Iine!" #babymetal
    image:
    - AxRk6D9CEAIj3ZU
    part-of:
      tour: headbangpilgrimage

