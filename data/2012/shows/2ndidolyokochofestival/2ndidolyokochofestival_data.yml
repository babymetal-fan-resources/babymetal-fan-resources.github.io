- postx:
    id: 188873019127631872
    account: BABYMETAL_JAPAN
    label: Today
    published-date: 2012-04-08
    text: |-
      今日の渋谷はさくらが満開のお花見日和！！そしてモッシュッシュ日和の最高のお天気DEATH！！Shibuya-AX！！代々木公園のお花見に負けないくらいアツくいくよー！！こいやーっ！！ #babymetal
    translation: |-
      Today in Shibuya is a perfect day for viewing cherry blossoms in full bloom!!
      And it's the greatest weather for a MOSH'SH day DEATH!!
      Shibuya-AX!! We're going to make this as hot as the cherry blossom viewing at Yoyogi Park!!
      Bring it on!! #babymetal
    image:
    - Ap8DAp0CEAEsvvb
    part-of:
      show:
        year: 2012
        id: 2ndidolyokochofestival

- postx:
    id: 188992603973369856
    account: BABYMETAL_JAPAN
    label: Thank you
    published-date: 2012-04-08
    text: |-
      大きな会場でのライブ、ガイコツバンドとの共演と初挑戦でド・キ・ド・キ☆モーニングでしたが、皆さんから頂いた沢山のアツい声援がキツネさんに届き、ステージに神が降臨してきました！！ありがとうございました！！We are BABYMETAL！！
    translation: |-
      With a show in a large venue and performing together with a skeleton band, it was our first time trying these things so it was a Doki Doki ☆ Morning, but all the passionate cheers we received from everyone reached the Fox God, and the Gods descended upon the stage!! Thank you very much!! We are BABYMETAL!!
    image:
    - Ap9vxaFCQAApl-_
    part-of:
      show:
        year: 2012
        id: 2ndidolyokochofestival

