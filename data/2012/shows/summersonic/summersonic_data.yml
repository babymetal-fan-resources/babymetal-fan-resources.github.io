- postx:
    id: 237183118077988864
    account: BABYMETAL_JAPAN
    label: Thank you
    published-date: 2012-08-19
    text: |-
      サマソニありがとうございました！！チケット完売後の出演発表だったのでホントはドキドキイブニングだったのですが、ライブが始まったら遠くの方までイッパイ集まって頂いて本当に感激DEATH！！一体感がハンパなかった！！皆さんに感謝！！感謝！！
    translation: |-
      Thank you very much for Summer Sonic!! Since our appearance was announced after tickets were sold out, we were honestly having nervous twitches (Doki Doki Evening), but once the show started, seeing so many people gathered all the way to the back really moved us deeply DEATH!! The sense of unity was insane!! Thanks to everyone!! Thank you!!
    image:
    - A0qkygwCEAMuv4B
    part-of:
      show:
        year: 2012
        id: summersonic

