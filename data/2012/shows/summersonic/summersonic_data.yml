- postx:
    id: 233855081567633408
    account: BABYMETAL_JAPAN
    label: Announcement
    published-date: 2012-08-10
    text: |-
      BABYMETALサマソニ情報DEATH！！19日18時10分〜20分、SIDE-SHOW MESSEの予定DEATH！！。短い時間ですが幕張メッセの屋根をぶち破っちまうくらいの勢いで望みます！！
      http://bit.ly/QkFd1U
    translation: |-
      BABYMETAL Summer Sonic info DEATH!! Scheduled for SIDE-SHOW MESSE on the 19th from 18:10 to 18:20 DEATH!! Although it's a short time, we're going into it with enough momentum to tear the roof off Makuhari Messe!!
      http://bit.ly/QkFd1U
    image:
    - Az7R9SpCQAEQT5_
    part-of:
      show:
        year: 2012
        id: summersonic

- postx:
    id: 236405535082176512
    account: BABYMETAL_JAPAN
    label: Timetable
    published-date: 2012-08-17
    text: |-
      いよいよ19日はBABYMETAL初のサマソニ出場DEATH！！目黒鹿鳴館ライブを観に来て頂いたサマソニスタッフにも感謝！！18時10分〜幕張メッセSIDE-SHOW MESSE、入場規制ナシ、みんなで楽しくMOSH'SH PIT ！！
    translation: |-
      On the 19th, it's finally BABYMETAL's very first Summer Sonic appearance DEATH!! Thanks also to the Summer Sonic staff who came to watch our Meguro Rokumeikan live show!! From 18:10 at Makuhari Messe SIDE-SHOW MESSE, no admission restrictions, let's all have fun in the MOSH'SH PIT!!
    image:
    - A0fhlOYCYAAIe4p
    part-of:
      show:
        year: 2012
        id: summersonic

- postx:
    id: 236833364638851072
    account: BABYMETAL_JAPAN
    label: Tomorrow
    published-date: 2012-08-18
    text: |-
      BABYMETAL、明日は幕張メッセの方のSIDE-SHOWステージ、この地図のRAINBOWとSONICの間DEATH！！マリンじゃないよ〜！！横浜のイベントが終わってから駆けつけます！！ #サマソニ #babymetal
    translation: |-
      BABYMETAL, tomorrow is at the SIDE-SHOW stage on the Makuhari Messe side, between RAINBOW and SONIC on this map DEATH!! Not Marine~!! We'll rush over after our event in Yokohama finishes!! #SummerSonic #babymetal
    image:
    - A0lmsLxCYAEy2U7
    part-of:
      show:
        year: 2012
        id: summersonic

