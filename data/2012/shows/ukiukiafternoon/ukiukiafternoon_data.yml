- postx:
    id: 224114851805528064
    account: BABYMETAL_JAPAN
    label: Thank you
    published-date: 2026-08-31
    text: |-
      今日は観に来てくれた皆さん、臨時コーチのDJダイノジさん、ありがとうございました！普段のBABYMETALのライブでは出来ないこと満載で楽しかったDEATH！来週はいよいよ聖地・目黒鹿鳴館に神、降臨！！コルセットを忘れずに！！
    translation: |-
      To everyone who came to watch today, and to our temporary coach DJ Dainoji-san, thank you very much! It was packed with things we usually can't do at regular BABYMETAL live shows, so it was lots of fun DEATH! Next week, the Gods will finally descend upon the sacred ground of Meguro Rokumeikan!! Don't forget your corsets!!
    image:
    - Axw3RTPCQAASXyR
    part-of:
      show:
        year: 2012
        id: ukiukiafternoon

