- postx:
    id: 221592161274175488
    account: BABYMETAL_JAPAN
    label: Lottery ends tomorrow
    published-date: 2012-07-07
    text: |-
      明日は目黒鹿鳴館ライブのエントリー締め切り日DEATH！！沢山のご応募を頂いていますが、あと1日チャンスがありますのでぜひ応募して下さい！！BABYMETAL初めてのワンマン、ゼロからの伝説を一緒に作ろうよ！！ #babymetal
    translation: |-
      Tomorrow is the deadline to enter for the Meguro Rokumeikan live show DEATH!! We've received many applications, but there is still 1 day left, so please be sure to apply!! BABYMETAL's very first solo show, let's create a legend together from scratch!! #babymetal
    image:
    - AxNA5YpCIAAM1l7
    part-of:
      show:
        year: 2012
        id: corsetfestival

- postx:
    id: 226277580251213826
    account: BABYMETAL_JAPAN
    label: Tomorrow
    published-date: 2012-07-20
    text: |-
      いよいよ明日、目黒鹿鳴館！！コルセット忘れたら、ダメ、ゼッタイ「We are BABYMETAL！！」 #babymetal
    translation: |-
      Finally, tomorrow is Meguro Rockmaykan!!
      If you forget your corset, it's No, Absolutely Not (Dame, Zettai)
      "We are BABYMETAL!!" #babymetal
    image:
    - AyPmQqfCMAA_OPe
    part-of:
      show:
        year: 2012
        id: corsetfestival

- postx:
    id: 226604937411444737
    account: BABYMETAL_JAPAN
    label: Starting soon
    published-date: 2012-07-21
    text: |-
      目黒〜！！コルセットの準備はできてるか〜！！もうすぐ「LEGEND〜コルセット祭り」はっじまっるよ〜！！ #babymetal
    translation: |-
      Meguro~!! Are your corsets ready~!! "LEGEND ~ Corset Festival" is sta~rt~ing soon~!! #babymetal
    image:
