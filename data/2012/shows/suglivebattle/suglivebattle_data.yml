- postx:
    id: 237542080614907904
    account: BABYMETAL_JAPAN
    label: Thank you
    published-date: 2012-08-20
    text: |-
      SuGさん、たむらぱんさんとのライブありがとうございました！！今日初めてBABYMETALを観てくれた方もたくさんいたと思いますが、またライブに来てくれたらいいね！DEATH！！10月6日のワンマンライブ先行予約もはじまったよ～！！
    translation: |-
      Thank you very much for the live show with SuG-san and Tamurapan-san!! I think there were many people who saw BABYMETAL for the first time today, but it would be great (Iine!) if you came to our live shows again DEATH!! Advance ticket reservations for the October 6 one-man live show have started too~!!
