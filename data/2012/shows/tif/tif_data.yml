- postx:
    id: 231566778357129216
    account: BABYMETAL_JAPAN
    label: Today
    published-date: 2012-08-04
    text: |-
      【知らない人には教えてね！！】本日「TIF2012」のBABYMETALの出演時間は、16時10分から「DOLL FACTORY：Rock’ｎ on IDOL SHOW」の1番目DEATH！！遅刻、ダメ、ゼッタイ #babymetal
    translation: |-
      [Tell anyone who doesn't know!!] Today at "TIF2012," BABYMETAL's appearance time is 1st up at "DOLL FACTORY: Rock'n on IDOL SHOW" from 16:10 DEATH!! Being late, No, Absolutely Not #babymetal
    image:
    - Azawwg5CIAAkyZx
    part-of:
      show:
        year: 2012
        id: tif

