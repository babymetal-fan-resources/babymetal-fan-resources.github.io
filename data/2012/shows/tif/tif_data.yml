- postx:
    id: 231731315014250497
    account: BABYMETAL_JAPAN
    label: Thank you
    published-date: 2012-08-04
    text: |-
      THANX！！TIFバージョンのBABYMETALポーズDETAH！！入場規制がかかってしまい残念ながら見れなかったという話も。。次はもっと大きなステージに立てるように！！そして8月19日（日）サマソニにベビメタ急遽出現！！ギャーッ！！
    translation: |-
      THANX!! The TIF version of the BABYMETAL pose DEATH!! We heard some people unfortunately couldn't watch due to entry restrictions... So that we can stand on an even bigger stage next time!! And on Sunday, August 19, BabyMetal will suddenly appear at Summer Sonic!! Gyaaah!!
    image:
    - AzdGZztCMAAOkmQ
    part-of:
      show:
        year: 2012
        id: tif

