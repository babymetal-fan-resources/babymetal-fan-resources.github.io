- postx:
    id: 2087155015542768044
    account: cannonball_live
    label: Thank you
    info: 1 additional image
    published-date: 2026-08-11
    text: |-
      💥CANNONBALL外伝💥
      
      ／
      全日程、終演いたしました！
      ご来場いただきありがとうございました！
      ＼
      
      CANNONBALL“外伝”――
      最高に熱く、最高に濃い、規格外の3日間を皆さんと駆け抜けました！
      
      熱いステージで魅せてくれた出演アーティストの皆様、
      そして最後まで全力の歓声で応えてくださった皆様。
      会場が一つになり、最高の熱狂と景色を創り上げることができました！
      
      皆さんとだからこそ生まれた、忘れられない3日間。
      本当にありがとうございました！
      
      そして、この熱狂はまだ終わらない――。
      また来年、さらに最高の景色を一緒に創りましょう！
      CANNONBALLで、必ずお会いしましょう！！
      
      💣CANNONBALL外伝 公式サイト
      https://cannonball-live.jp
      
      #Chevon #東京スカパラダイスオーケストラ #MAZZEL #マカロニえんぴつ #マルシィ
      #ENTH #SiM #ハルカミライ #04LimitedSazabys #BABYMETAL
      #浅井健一 #クロマニヨンズ #ZAZENBOYS #聖飢魔II #マキシマムザホルモン
      
      #CANNONBALL外伝 #CANNONBALL #キャノンボール
      #有明アリーナ
    translation: |-
      💥CANNONBALL Gaiden💥
      
      ／
      All schedules have now concluded!
      Thank you very much for coming!
      ＼
      
      CANNONBALL "Gaiden"—
      We dashed through an intensely passionate, intensely packed, extraordinary 3 days with all of you!
      
      To all the performing artists who captivated us with their fiery stages,
      and to everyone who responded with full-throttle cheers right until the end.
      The entire venue became one, creating the ultimate craze and spectacle!
      
      An unforgettable 3 days that could only be made possible because of all of you.
      Thank you so very much!
      
      And this excitement doesn't end here—.
      Let's create an even more incredible scene together again next year!
      We will definitely see you at CANNONBALL!!
      
      💣CANNONBALL Gaiden Official Website
      https://cannonball-live.jp
      
