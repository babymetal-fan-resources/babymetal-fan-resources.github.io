      Special 7" “My Queen: Intuit Dome Anniversary Edition” Release♟️
      link in bio
      
      Celebrate the one year anniversary of BABYMETAL’s Intuit Dome show with a special 7" release, pressed on transparent vinyl.
      Side A features the studio version of “My Queen (feat. Spiritbox),” while Side B captures the explosive live performance from Intuit Dome, where Spiritbox’s Courtney LaPlante joined BABYMETAL on stage to bring the collaboration to life🔥
      
      Tracklist👇
      SIDE A
      - My Queen (feat. Spiritbox)
      SIDE B
      - My Queen (feat. Spiritbox) [Live from Intuit Dome]
