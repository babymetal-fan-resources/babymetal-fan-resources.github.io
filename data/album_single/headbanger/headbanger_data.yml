- postfacebook:
    id: 386779261369346
    account: BABYMETAL.jp
    label: Announcement store bonuses
    published-date: 2012-06-14
    text: |-
      HMV／TSUTAYA／TOWER RECORDS全国各店での「オリジナル特典」情報DEATH！！
      各チェーンの「オリジナル特典」対象店舗で予約・購入されたお客様に、先着でオリジナル・ポストカード・セットをプレゼント！
      ※先着順での配布となります。各店とも予約・販売数が予定枚数に達し次第、配布終了となります。
      
      対象商品、対象店舗などの詳細はオフィシャルサイトへ！！
      www.babymetal.jp
    translation: |-
      "Original Bonus" information at HMV / TSUTAYA / TOWER RECORDS stores nationwide DEATH!!
      Customers who pre-order or purchase at eligible "Original Bonus" stores of each chain will receive an original postcard set on a first-come, first-served basis!
      *Distribution is on a first-come, first-served basis. At each store, distribution will end as soon as pre-orders/sales reach the planned quantity.
      
      For details on eligible products, participating stores, etc., visit the official website!!
      www.babymetal.jp
    image:
    - 386779261369346
    part-of:
      webpage:
        domain: babymetal.jp
        id: news.3046

